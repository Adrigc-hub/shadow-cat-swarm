<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Cat Dash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MENÚ PRINCIPAL -->
    <div id="main-menu" class="menu-overlay">
        <h1>SHADOW CAT DASH</h1>
        <p class="subtitle">Edición Jujutsu Kaisen</p>
        
        <div class="auth-section">
            <input type="text" id="username" placeholder="Usuario">
            <button onclick="login()">Iniciar Sesión</button>
            <span id="auth-status">Modo Invitado (Progreso Local)</span>
        </div>

        <div class="menu-buttons">
            <button class="btn-main" onclick="startGame()">JUGAR</button>
            <button class="btn-main" onclick="openShop()">TIENDA SKINS</button>
        </div>
    </div>

    <!-- TIENDA DE SKINS -->
    <div id="shop-menu" class="menu-overlay hidden">
        <h2>TIENDA DE SKINS (JJK)</h2>
        <div class="skins-grid">
            <div class="skin-card" onclick="selectSkin('shadow')">
                <div class="skin-preview" id="prev-shadow"></div>
                <p>Gato Sombra (Base)</p>
            </div>
            <div class="skin-card" onclick="selectSkin('gojo')">
                <div class="skin-preview" id="prev-gojo"></div>
                <p>Gato Gojo (6 Limitless)</p>
            </div>
            <div class="skin-card" onclick="selectSkin('sukuna')">
                <div class="skin-preview" id="prev-sukuna"></div>
                <p>Gato Sukuna (Maldición)</p>
            </div>
        </div>
        <button class="btn-back" onclick="closeShop()">Volver al Menú</button>
    </div>

    <!-- PANTALLA DE JUEGO -->
    <div id="game-container">
        <div id="hud">
            <span id="level-display">Nivel: 1</span>
            <span id="score-display">Intentos: 1</span>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <script src="game.js"></script>
</body>
</html>
